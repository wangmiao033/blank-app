name: Build Goodnight Gadget V4 Responsive APK
on:
  push:
    branches: [build/goodnight-v4-responsive-20261121]
    paths:
      - 'goodnight-v3-build/source.base64'
      - '.github/workflows/goodnight-v4-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'goodnight-v3-build/source.base64'
      - '.github/workflows/goodnight-v4-apk.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify archive and extract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p goodnight-v4-build/project
          tr -d '\r\n' < goodnight-v3-build/source.base64 | base64 -d > /tmp/goodnight-v4-source.tar.xz
          echo 'b3face401ec9c093c244b02ad1dcd874dbcc89e0e7e1060b9956eaaa0dd38625  /tmp/goodnight-v4-source.tar.xz' | sha256sum -c -
          tar xJf /tmp/goodnight-v4-source.tar.xz -C goodnight-v4-build/project
          grep -F "applicationId 'com.goodnight.gadget.v4'" goodnight-v4-build/project/app/build.gradle
      - name: Compile V4 APK
        run: gradle -p goodnight-v4-build/project :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GoodnightGadget-V4-APK
          path: goodnight-v4-build/project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Save installable APK on isolated V4 branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p goodnight-v4-build/output
          cp goodnight-v4-build/project/app/build/outputs/apk/debug/app-debug.apk goodnight-v4-build/output/GoodnightGadget-V4-debug.apk
          sha256sum goodnight-v4-build/output/GoodnightGadget-V4-debug.apk > goodnight-v4-build/output/SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goodnight-v4-build/output/GoodnightGadget-V4-debug.apk goodnight-v4-build/output/SHA256.txt
          git diff --cached --quiet || git commit -m 'build: store verified Goodnight Gadget V4 APK'
          git push origin HEAD:refs/heads/build/goodnight-v4-responsive-20261121
